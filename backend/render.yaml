# Render blueprint. Point Render at this repo and it reads this file, rather
# than needing the service configured by hand in the dashboard.
#
# The database is Supabase, not Render Postgres, so no database block appears
# here — DATABASE_URL is set as an environment variable instead.

services:
  - type: web
    name: srms
    runtime: python
    plan: free
    region: singapore          # closest Render region to Biliran
    # No rootDir: this repository's root *is* the Django project — manage.py,
    # build.sh and this file all sit at the top level.
    buildCommand: "./build.sh"
    # One worker, several threads — not two workers. Each worker is a separate
    # process that loads Django, reportlab, lxml, pillow and docxtpl into its
    # own memory; two of them do not fit in the free plan's 512 MB once a
    # masterlist render starts allocating. Threads share that memory, and the
    # workload is I/O-bound on Postgres anyway. Raise workers only along with
    # the instance size.
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 8 --timeout 120"
    healthCheckPath: /login/
    envVars:
      # Pinned because the venv and the deployed runtime should not drift.
      - key: PYTHON_VERSION
        value: "3.13.7"

      # Generated by Render on first deploy, then held constant. Rotating it
      # signs everyone out, so it is deliberately not regenerated per deploy.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # Supabase connection string. Must be the POOLER host
      # (aws-0-<region>.pooler.supabase.com), session mode, port 5432.
      #
      # Not the direct host db.<ref>.supabase.co: it publishes an AAAA record
      # and no A record, and Render's free tier has no IPv6 egress, so that
      # host is simply unreachable from here. Full reasoning in settings.py.
      - key: DATABASE_URL
        sync: false            # set in the dashboard; never committed

      # Uploads go to Supabase Storage: the free plan has no persistent disk,
      # so anything written to the container is lost on the next deploy.
      - key: USE_SUPABASE_STORAGE
        value: "True"
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false

      - key: TIME_ZONE
        value: Asia/Manila
      - key: LOG_LEVEL
        value: INFO
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"

      # Applicants are told what the office decided by email as well as in the
      # portal, and every registration carries a confirmation link.
      #
      # This goes out over Brevo's HTTPS API, not SMTP, and that is not a
      # preference. Render blocks outbound traffic to ports 25, 465 and 587 from
      # free web services, so a perfectly correct Gmail SMTP configuration
      # connects to nothing here: every send waits out EMAIL_TIMEOUT and is
      # swallowed by api.notify, which is what it is built to do. The site looks
      # like it is emailing people and is not.
      #
      # Brevo was chosen for one reason: it verifies a single sender ADDRESS by
      # emailing it a link, where most providers verify a whole DOMAIN by DNS
      # record. Nobody here can add records to bipsu.edu.ph. Its free tier is
      # 300 messages a day.
      #
      # Set BREVO_API_KEY (Brevo > SMTP & API > API keys) and EMAIL_HOST_USER to
      # the address you verified under Brevo > Senders. Brevo refuses any other
      # sender, and DEFAULT_FROM_EMAIL is derived from EMAIL_HOST_USER.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false

      # The SMTP route, kept for anywhere it is actually reachable: a paid
      # instance, or the university running this on its own server. Leave
      # EMAIL_HOST unset on Render — BREVO_API_KEY takes precedence anyway,
      # and setting both invites the belief that the SMTP one is doing
      # something. For Gmail, EMAIL_HOST_PASSWORD must be an App Password.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      # Optional. Unset, the From line is derived from EMAIL_HOST_USER, which
      # is the only address the sending account is certain to be allowed to use.
      - key: DEFAULT_FROM_EMAIL
        sync: false

      # Builds the links inside those emails. Without it a message carries no
      # link at all rather than one pointing nowhere.
      - key: SITE_URL
        sync: false

      # The office account, created by `manage.py bootstrap` during the build.
      # This plan has no shell, so createsuperuser cannot be run by hand and
      # this is the only way in on a fresh database.
      #
      # An office whose password is unset is skipped rather than created with
      # a guessable one, and an account that already exists is never touched —
      # so changing a password in the admin survives the next deploy.
      - key: SDSO_EMAIL
        sync: false
      - key: SDSO_PASSWORD
        sync: false

      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS are only needed for a custom
      # domain; settings.py adds the service's own onrender.com hostname.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
