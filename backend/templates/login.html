<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — BiPSU SRMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f6f8fc; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl mb-4" style="background:#3b5bdb;">
        <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <h1 class="text-2xl font-bold" style="letter-spacing:-0.02em;color:#1e2a3a;">BiPSU SRMS</h1>
      <p class="text-sm mt-1" style="color:#6b7a99;">Scholarship Records Management System</p>
    </div>

    <div style="background:#fff;border-radius:0.75rem;border:1px solid #e8ecf0;padding:1.5rem;">
      {% if error %}
      <div class="mb-4 p-3 rounded-lg text-sm" style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label style="font-size:0.75rem;font-weight:500;color:#374151;">Email</label>
            <input type="email" name="email" placeholder="you@bipsu.edu.ph" required style="width:100%;border-radius:0.5rem;border:1px solid #e8ecf0;padding:0.5rem 0.75rem;font-size:0.875rem;font-family:inherit;outline:none;" />
          </div>
          <div class="space-y-1.5">
            <label style="font-size:0.75rem;font-weight:500;color:#374151;">Password</label>
            <input type="password" name="password" placeholder="••••••••" required style="width:100%;border-radius:0.5rem;border:1px solid #e8ecf0;padding:0.5rem 0.75rem;font-size:0.875rem;font-family:inherit;outline:none;" />
          </div>
          <button type="submit" style="width:100%;background:#3b5bdb;color:#fff;border:none;border-radius:0.5rem;padding:0.6rem 1rem;font-size:0.875rem;font-weight:500;cursor:pointer;font-family:inherit;">
            Sign In
          </button>
        </div>
      </form>
    </div>
    <p class="text-center text-sm mt-4" style="color:#6b7a99;">No account yet? <a href="/register/" style="color:#3b5bdb;font-weight:500;">Register</a></p>
    <p class="text-center text-sm mt-2" style="color:#6b7a99;">Affirmative / NSU Staff scholar? <a href="/apply/login/" style="color:#2f9e44;font-weight:500;">Sign in here</a></p>
    <p class="text-center text-sm mt-2"><a href="/" style="color:#6b7a99;">← Back to Scholarships</a></p>
  </div>
</body>
</html>
