<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — BiPSU SRMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f6f8fc; -webkit-font-smoothing: antialiased; }
    label { font-size:0.75rem; font-weight:500; color:#374151; }
    input, select { width:100%; border-radius:0.5rem; border:1px solid #e8ecf0; padding:0.5rem 0.75rem; font-size:0.875rem; font-family:inherit; outline:none; background:#fff; }
    input:focus, select:focus { border-color:#3b5bdb; box-shadow:0 0 0 2px #edf2ff; }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center p-4 py-10">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <img src="/media/logos/BiPSU.png" alt="BiPSU" class="h-16 w-16 object-contain mx-auto mb-4" />
      <h1 class="text-2xl font-bold" style="letter-spacing:-0.02em;color:#1e2a3a;">BiPSU SRMS</h1>
      <p class="text-sm mt-1" style="color:#6b7a99;">Scholarship Records Management System</p>
    </div>

    {% if errors %}
    <div class="mb-4 p-3 rounded-lg text-sm" style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;">
      {% for e in errors %}<p>{{ e }}</p>{% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <!-- Personal Information Card -->
      <div style="background:#fff;border-radius:0.75rem;border:1px solid #e8ecf0;padding:1.5rem;">
        <p class="text-xs font-semibold uppercase tracking-wider mb-4" style="color:#3b5bdb;">Personal Information</p>
        <div class="space-y-3">

          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label>First Name</label>
              <input name="first_name" value="{{ post.first_name }}" placeholder="Juan" required />
            </div>
            <div class="space-y-1.5">
              <label>Last Name</label>
              <input name="last_name" value="{{ post.last_name }}" placeholder="Dela Cruz" required />
            </div>
          </div>

          <div class="space-y-1.5">
            <label>Student ID</label>
            <input name="student_id" value="{{ post.student_id }}" placeholder="e.g. 2021-00001" required />
          </div>

          <div class="space-y-1.5">
            <label>Email</label>
            <input type="email" name="email" value="{{ post.email }}" placeholder="you@bipsu.edu.ph" required />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label>Contact Number</label>
              <input name="contact_number" value="{{ post.contact_number }}" placeholder="09XXXXXXXXX" />
            </div>
            <div class="space-y-1.5">
              <label>Date of Birth</label>
              <input type="date" name="date_of_birth" value="{{ post.date_of_birth }}" />
            </div>
          </div>

          <div class="space-y-1.5">
            <label>Gender</label>
            <select name="gender">
              <option value="">— Select —</option>
              <option value="Male" {% if post.gender == "Male" %}selected{% endif %}>Male</option>
              <option value="Female" {% if post.gender == "Female" %}selected{% endif %}>Female</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <label>Course</label>
              <input name="course" value="{{ post.course }}" placeholder="e.g. BSIT" required />
            </div>
            <div class="space-y-1.5">
              <label>Year Level</label>
              <select name="year_level">
                <option value="1" {% if post.year_level == "1" %}selected{% endif %}>1st Year</option>
                <option value="2" {% if post.year_level == "2" %}selected{% endif %}>2nd Year</option>
                <option value="3" {% if post.year_level == "3" %}selected{% endif %}>3rd Year</option>
                <option value="4" {% if post.year_level == "4" %}selected{% endif %}>4th Year</option>
              </select>
            </div>
          </div>

        </div>
      </div>

      <!-- Account Security Card -->
      <div style="background:#fff;border-radius:0.75rem;border:1px solid #e8ecf0;padding:1.5rem;">
        <p class="text-xs font-semibold uppercase tracking-wider mb-4" style="color:#3b5bdb;">Account Security</p>
        <div class="space-y-3">
          <div class="space-y-1.5">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required />
          </div>
          <div class="space-y-1.5">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="••••••••" required />
          </div>
        </div>
      </div>

      <button type="submit" style="width:100%;background:#3b5bdb;color:#fff;border:none;border-radius:0.5rem;padding:0.6rem 1rem;font-size:0.875rem;font-weight:500;cursor:pointer;font-family:inherit;">
        Create Account
      </button>
    </form>

    <p class="text-center text-sm mt-4" style="color:#6b7a99;">Already have an account? <a href="/login/" style="color:#3b5bdb;font-weight:500;">Sign in</a></p>
    <p class="text-center text-sm mt-2"><a href="/" style="color:#6b7a99;">← Back to Scholarships</a></p>
  </div>
</body>
</html>
