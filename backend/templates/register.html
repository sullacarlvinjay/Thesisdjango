<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — BiPSU SRMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f6f8fc; -webkit-font-smoothing: antialiased; }
    input, select { width:100%; border-radius:0.5rem; border:1px solid #e8ecf0; padding:0.5rem 0.75rem; font-size:0.875rem; background:#fff; outline:none; font-family:inherit; }
    input:focus, select:focus { border-color:#3b5bdb; box-shadow:0 0 0 2px #edf2ff; }
    label { font-size:0.75rem; font-weight:500; color:#374151; display:block; margin-bottom:0.375rem; }
    .section-title { font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:#3b5bdb; margin-bottom:1rem; }
    .card { background:#fff; border-radius:0.75rem; border:1px solid #e8ecf0; padding:1.5rem; }
  </style>
</head>
<body class="py-8 px-4">
  <div class="max-w-3xl mx-auto">
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl mb-4" style="background:#3b5bdb;">
        <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <h1 class="text-2xl font-bold" style="letter-spacing:-0.02em;color:#1e2a3a;">Create your account</h1>
      <p class="text-sm mt-1" style="color:#6b7a99;">BiPSU Scholarship Records Management System</p>
    </div>

    {% if errors %}
    <div class="mb-4 p-3 rounded-lg text-sm" style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;">
      {% for error in errors %}<p>{{ error }}</p>{% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div class="card">
        <p class="section-title">Account Information</p>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label>First Name</label><input name="first_name" required /></div>
          <div><label>Last Name</label><input name="last_name" required /></div>
          <div><label>Email</label><input name="email" type="email" required /></div>
          <div><label>Password</label><input name="password" type="password" required /></div>
        </div>
      </div>

      <div class="card">
        <p class="section-title">Student Information</p>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label>Student ID</label><input name="student_id" required /></div>
          <div><label>Course</label><input name="course" required /></div>
          <div><label>Year Level</label>
            <select name="year_level">
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
            </select>
          </div>
          <div><label>GWA</label><input name="gwa" type="number" step="0.01" min="1.0" max="5.0" required /></div>
          <div><label>Contact Number</label><input name="contact_number" /></div>
          <div><label>Date of Birth</label><input name="date_of_birth" type="date" /></div>
          <div><label>Gender</label>
            <select name="gender">
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div><label>Address</label><input name="address" /></div>
          <div><label>Family Income (annual)</label><input name="family_income" type="number" step="0.01" value="0" /></div>
          <div><label>Indigenous Group (if any)</label><input name="indigenous_group" /></div>
          <div><label>Parent Employment</label><input name="parent_employment" /></div>
        </div>
        <div class="grid sm:grid-cols-2 gap-3 mt-4">
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" name="is_pwd" style="width:auto;" /> Person with Disability (PWD)
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" name="is_athlete" style="width:auto;" /> Student Athlete
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" name="is_coconut_farmer_family" style="width:auto;" /> From Coconut Farmer Family
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" name="has_other_scholarship" style="width:auto;" /> Has Other Scholarship
          </label>
        </div>
      </div>

      <button type="submit" style="width:100%;background:#3b5bdb;color:#fff;border:none;border-radius:0.5rem;padding:0.65rem 1rem;font-size:0.875rem;font-weight:600;cursor:pointer;font-family:inherit;">
        Create Account
      </button>
      <p class="text-center text-sm" style="color:#6b7a99;">Already have an account? <a href="/login/" style="color:#3b5bdb;font-weight:500;">Sign in</a></p>
    </form>
  </div>
</body>
</html>
