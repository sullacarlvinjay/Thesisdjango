<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ── Download chart as PNG ─────────────────────────────────────────────────────
// The file this used to save looked broken, and for two separate reasons.
//
// A Chart.js canvas is transparent: it never paints a background, it just draws
// on whatever the card behind it is. toDataURL copies that transparency
// straight into the PNG, so the axis labels and the grid — mid greys, chosen to
// sit on white — landed on nothing at all. Opened anywhere with a dark backdrop
// (Windows Photos, Messenger, a dark-themed Docs) the chart was grey-on-black
// and read as a corrupt file. So the export is composited onto an opaque sheet
// first.
//
// The second reason really was 'no data'. Every button was drawn whether or not
// its chart had a single point in it, and an empty chart exports a blank
// rectangle. Those buttons are now switched off instead — see the bottom of
// this file.
function chartHasData(canvas) {
  const chart = (window.Chart && Chart.getChart) ? Chart.getChart(canvas) : null;
  if (!chart) return false;
  return (chart.data.datasets || []).some(function (ds) {
    return (ds.data || []).some(function (v) {
      const n = (v && typeof v === 'object') ? (v.y != null ? v.y : v.v) : v;
      return typeof n === 'number' && !isNaN(n) && n !== 0;
    });
  });
}

function downloadChart(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  if (!chartHasData(canvas)) return;   // the button is disabled; belt and braces

  // Always light: the PNG is going into a report or an email, not back into the
  // page, and a dark-mode export would print as a black block.
  const sheet = document.createElement('canvas');
  sheet.width = canvas.width;
  sheet.height = canvas.height;
  const ctx = sheet.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, sheet.width, sheet.height);
  ctx.drawImage(canvas, 0, 0);

  const link = document.createElement('a');
  link.download = filename + '.png';
  link.href = sheet.toDataURL('image/png');
  // Firefox ignores a click on an anchor that is not in the document.
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

const gridColor = '#e8ecf0';
Chart.defaults.font = { family: 'inherit', size: 12 };
Chart.defaults.color = '#6b7a99';
const PIE_COLORS = [
  '#3b5bdb','#1971c2','#2f9e44','#f59f00','#e64980',
  '#7048e8','#0ca678','#f76707','#c2255c','#6b7a99',
];

// ── Helper: build toggle buttons and re-render chart on click ─────────────────
function makeToggle(containerId, chartRef, types, buildFn) {
  const container = document.getElementById(containerId);
  if (!container) return;
  types.forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'chart-toggle-btn' + (type === types[0] ? ' active' : '');
    btn.textContent = type.charAt(0).toUpperCase() + type.slice(1);
    btn.onclick = () => {
      container.querySelectorAll('.chart-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chartRef.chart.destroy();
      chartRef.chart = buildFn(type);
    };
    container.appendChild(btn);
  });
}

// ── Program Chart ─────────────────────────────────────────────────────────────
{% if selected_type %}
const programLabels = [{% for c in course_dist %}'{{ c.course|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const programData   = [{% for c in course_dist %}{{ c.scholars }}{% if not forloop.last %},{% endif %}{% endfor %}];
const programRef = {};
function buildProgramChart(type) {
  const isPie = type === 'pie' || type === 'doughnut';
  return new Chart(document.getElementById('programChart'), {
    type,
    data: {
      labels: programLabels,
      datasets: [{
        label: 'Scholars',
        data: programData,
        backgroundColor: PIE_COLORS,
        borderWidth: 1,
        borderRadius: isPie ? 0 : 6,
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: isPie ? 'right' : 'top', labels: { boxWidth: 12, font: { size: 11 } }, display: isPie },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} scholars` } },
      },
      scales: isPie ? {} : {
        x: { grid: { color: gridColor } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1, precision: 0 } },
      },
    },
  });
}
programRef.chart = buildProgramChart('pie');
makeToggle('programChartToggle', programRef, ['pie','doughnut','bar','line'], buildProgramChart);

{% else %}
const rcMap = { {% for t, cnt in rollover_counts.items %}'{{ t }}': {{ cnt }}{% if not forloop.last %},{% endif %}{% endfor %} };
const allLabels = [{% for t in all_types %}'{{ t }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const allCounts = allLabels.map(t => rcMap[t] || 0);
const filteredLabels = allLabels.filter((_, i) => allCounts[i] > 0);
const filteredCounts = allCounts.filter(v => v > 0);
const chartLabels = filteredLabels.length ? filteredLabels : allLabels;
const chartCounts = filteredLabels.length ? filteredCounts : allCounts;
const programRef = {};
function buildProgramChart(type) {
  const isPie = type === 'pie' || type === 'doughnut';
  return new Chart(document.getElementById('programChart'), {
    type,
    data: {
      labels: chartLabels,
      datasets: [{
        label: 'Scholars',
        data: chartCounts,
        backgroundColor: PIE_COLORS,
        borderWidth: 1,
        borderRadius: isPie ? 0 : 6,
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: isPie, position: 'right', labels: { boxWidth: 12, font: { size: 11 } } },
      },
      scales: isPie ? {} : {
        x: { grid: { color: gridColor } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1, precision: 0 } },
      },
    },
  });
}
programRef.chart = buildProgramChart('bar');
makeToggle('programChartToggle', programRef, ['bar','pie','doughnut','line'], buildProgramChart);
{% endif %}

{% if gpa_ranges %}
// ── GWA Chart ─────────────────────────────────────────────────────────────────
const gwaLabels = [{% for g in gpa_ranges %}'{{ g.range }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const gwaData   = [{% for g in gpa_ranges %}{{ g.count }}{% if not forloop.last %},{% endif %}{% endfor %}];
const gwaRef = {};
function buildGwaChart(type) {
  const isPie = type === 'pie' || type === 'doughnut';
  return new Chart(document.getElementById('gwaChart'), {
    type,
    data: {
      labels: gwaLabels,
      datasets: [{
        label: 'Students',
        data: gwaData,
        backgroundColor: ['#3b5bdb','#4c6ef5','#748ffc','#91a7ff','#bac8ff'],
        borderColor: '#3b5bdb',
        borderWidth: isPie ? 1 : 2,
        borderRadius: isPie ? 0 : 6,
        fill: type === 'line',
        tension: 0.4,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: isPie } },
      scales: isPie ? {} : {
        x: { grid: { color: gridColor } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1, precision: 0 } },
      },
    },
  });
}
gwaRef.chart = buildGwaChart('bar');
makeToggle('gwaChartToggle', gwaRef, ['bar','pie','doughnut','line'], buildGwaChart);
{% endif %}

// ── School Chart ──────────────────────────────────────────────────────────────
{% if school_dist %}
const sLabels = [{% for s in school_dist %}'{{ s.school|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const sData   = [{% for s in school_dist %}{{ s.scholars }}{% if not forloop.last %},{% endif %}{% endfor %}];
const schoolRef = {};
function buildSchoolChart(type) {
  const isPie = type === 'pie' || type === 'doughnut';
  return new Chart(document.getElementById('schoolChart'), {
    type: isPie ? type : 'bar',
    data: {
      labels: sLabels,
      datasets: [{
        label: 'Scholars',
        data: sData,
        backgroundColor: isPie ? PIE_COLORS : '#7048e8',
        borderColor: '#7048e8',
        borderWidth: isPie ? 1 : 2,
        borderRadius: isPie ? 0 : 6,
        fill: type === 'line',
        tension: 0.4,
      }],
    },
    options: {
      // Horizontal by default: a school's name is a sentence, and it has room
      // to be read on the y-axis where it would be turned on its side below.
      indexAxis: (!isPie && type !== 'line') ? 'y' : 'x',
      responsive: true,
      plugins: { legend: { display: isPie } },
      scales: isPie ? {} : {
        x: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1, precision: 0 } },
        y: { grid: { color: gridColor } },
      },
    },
  });
}
schoolRef.chart = buildSchoolChart('bar');
makeToggle('schoolChartToggle', schoolRef, ['bar','pie','doughnut','line'], buildSchoolChart);
{% endif %}

// ── Course Chart ──────────────────────────────────────────────────────────────
{% if course_dist %}
const cLabels = [{% for c in course_dist %}'{{ c.course|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const cData   = [{% for c in course_dist %}{{ c.scholars }}{% if not forloop.last %},{% endif %}{% endfor %}];
const courseRef = {};
function buildCourseChart(type) {
  const isPie = type === 'pie' || type === 'doughnut';
  const isHBar = type === 'bar';
  return new Chart(document.getElementById('courseChart'), {
    type: isPie ? type : 'bar',
    data: {
      labels: cLabels,
      datasets: [{
        label: 'Scholars',
        data: cData,
        backgroundColor: isPie ? PIE_COLORS : '#1971c2',
        borderColor: '#1971c2',
        borderWidth: isPie ? 1 : 2,
        borderRadius: isPie ? 0 : 6,
        fill: type === 'line',
        tension: 0.4,
      }],
    },
    options: {
      indexAxis: (!isPie && type !== 'line') ? 'y' : 'x',
      responsive: true,
      plugins: { legend: { display: isPie } },
      scales: isPie ? {} : {
        x: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1, precision: 0 } },
        y: { grid: { color: gridColor } },
      },
    },
  });
}
courseRef.chart = buildCourseChart('bar');
makeToggle('courseChartToggle', courseRef, ['bar','pie','doughnut','line'], buildCourseChart);
{% endif %}

// ── Scholars Over Time Chart ──────────────────────────────────────────────────
{% if trend_data|length > 1 %}
const trendLabels = [{% for t in trend_data %}'{{ t.display|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];

// One entry per programme. Chart.js index-mode tooltips list every series at a
// point, so the breakdown that used to be built by hand is now just the tooltip.
const trendSeries = [
  {% for s in trend_series %}
  { name: '{{ s.type|escapejs }}', data: [{% for c in s.counts %}{{ c }}{% if not forloop.last %},{% endif %}{% endfor %}] }{% if not forloop.last %},{% endif %}
  {% endfor %}
];

const trendRef = {};

function buildTrendChart(type) {
  const isLine = type === 'line';
  return new Chart(document.getElementById('trendChart'), {
    type: isLine ? 'line' : 'bar',
    data: {
      labels: trendLabels,
      datasets: trendSeries.map(function (s, i) {
        const colour = PIE_COLORS[i % PIE_COLORS.length];
        return {
          label: s.name,
          data: s.data,
          backgroundColor: isLine ? 'transparent' : colour,
          borderColor: colour,
          borderWidth: isLine ? 2.5 : 1.5,
          borderRadius: isLine ? 0 : 6,
          pointBackgroundColor: colour,
          pointRadius: isLine ? 4 : 0,
          pointHoverRadius: isLine ? 6 : 0,
          fill: false,
          tension: 0.4,
        };
      }),
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        // With one programme selected the legend would just repeat the heading.
        legend: {
          display: trendSeries.length > 1,
          position: 'bottom',
          labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true, font: { size: 11 } },
        },
        tooltip: {
          callbacks: {
            title: (items) => items[0].label.replace('\\n', ' '),
          },
        },
      },
      scales: {
        x: {
          grid: { color: gridColor },
          ticks: { maxRotation: 45, minRotation: 30 },
        },
        y: {
          beginAtZero: true,
          grid: { color: gridColor },
          ticks: { stepSize: 1, precision: 0 },
          title: { display: true, text: 'Number of Scholars', color: '#6b7a99', font: { size: 11 } },
        },
      },
    },
  });
}

trendRef.chart = buildTrendChart('line');
makeToggle('trendChartToggle', trendRef, ['line', 'bar'], buildTrendChart);
{% endif %}


// ── PNG buttons ───────────────────────────────────────────────────────────────
// Delegated, so the markup carries only which canvas it means. Runs last, once
// every chart above has been built: a button whose chart came out empty is
// switched off and says why, rather than handing over a blank rectangle and
// leaving the person to wonder whether the export is broken.
(function () {
  document.querySelectorAll('.chart-png-btn').forEach(function (btn) {
    var canvas = document.getElementById(btn.dataset.png);
    if (canvas && chartHasData(canvas)) return;
    btn.disabled = true;
    btn.title = 'No data to export for the semester and programme you are viewing.';
  });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.chart-png-btn');
    if (!btn || btn.disabled) return;
    downloadChart(btn.dataset.png, btn.dataset.pngName);
  });
})();
</script>
