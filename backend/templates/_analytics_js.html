<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
function chartHasData(canvas) {
  const chart = (window.Chart && Chart.getChart) ? Chart.getChart(canvas) : null;
  if (!chart) return false;
  return (chart.data.datasets || []).some(function (ds) {
    return (ds.data || []).some(function (v) {
      const n = (v && typeof v === 'object') ? (v.y != null ? v.y : v.v) : v;
      return typeof n === 'number' && !isNaN(n) && n !== 0;
    });
  });
}
function downloadChart(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (!chartHasData(canvas)) return;
  const sheet = document.createElement('canvas');
  sheet.width = canvas.width;
  sheet.height = canvas.height;
  const ctx = sheet.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, sheet.width, sheet.height);
  ctx.drawImage(canvas, 0, 0);
  const link = document.createElement('a');
  link.download = filename + '.png';
  link.href = sheet.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
const gridColor = '#e8ecf0';
Chart.defaults.font = { family: 'inherit', size: 12 };
Chart.defaults.color = '#6b7a99';
const PIE_COLORS = [
  '#3b5bdb','#1971c2','#2f9e44','#f59f00','#e64980',
  '#7048e8','#0ca678','#f76707','#c2255c','#6b7a99',
];
const DEGREE_PREFIX = /^bachelor\s+(?:of\s+)?(?:science|arts)?\s*(?:in\s+)?/i;
const LEGEND_MAX = 26;
function legendText(text) {
  const short = String(text).replace(DEGREE_PREFIX, '').trim() || String(text);
  return short.length > LEGEND_MAX ? short.slice(0, LEGEND_MAX - 1) + '…' : short;
}
function shortLegendLabels(chart) {
  const type = chart.config.type;
  const generate = (Chart.overrides[type] && Chart.overrides[type].plugins
                    && Chart.overrides[type].plugins.legend
                    && Chart.overrides[type].plugins.legend.labels
                    && Chart.overrides[type].plugins.legend.labels.generateLabels)
                || Chart.defaults.plugins.legend.labels.generateLabels;
  return generate(chart).map(item =>
    Object.assign({}, item, { text: legendText(item.text) }));
}
function pieLegend(display, position) {
  return {
    display,
    position: position || 'right',
    labels: { boxWidth: 12, font: { size: 11 }, generateLabels: shortLegendLabels },
  };
}
function makeToggle(containerId, chartRef, types, buildFn) {
  const container = document.getElementById(containerId);
  if (!container) return;
  types.forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'chart-toggle-btn' + (type === types[0] ? ' active' : '');
    btn.textContent = type.charAt(0).toUpperCase() + type.slice(1);
    btn.onclick = () => {
      container.querySelectorAll('.chart-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chartRef.chart.destroy();
      chartRef.chart = buildFn(type);
    };
    container.appendChild(btn);
  });
}
{% if show_program %}
{% if selected_type %}
const programLabels = [{% for c in course_dist %}'{{ c.course|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const programData   = [{% for c in course_dist %}{{ c.scholars }}{% if not forloop.last %},{% endif %}{% endfor %}];
const programRef = {};
function buildProgramChart(type) {
  const isPie = type === 'pie' || type === 'doughnut';
  return new Chart(document.getElementById('programChart'), {
    type,
    data: {
      labels: programLabels,
      datasets: [{
        label: 'Scholars',
        data: programData,
        backgroundColor: PIE_COLORS,
        borderWidth: 1,
        borderRadius: isPie ? 0 : 6,
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: pieLegend(isPie, isPie ? 'right' : 'top'),
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} scholars` } },
      },
      scales: isPie ? {} : {
        x: { grid: { color: gridColor } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1, precision: 0 } },
      },
    },
  });
}
programRef.chart = buildProgramChart('pie');
makeToggle('programChartToggle', programRef, ['pie','doughnut','bar','line'], buildProgramChart);
{% else %}
const rcMap = { {% for t, cnt in rollover_counts.items %}'{{ t }}': {{ cnt }}{% if not forloop.last %},{% endif %}{% endfor %} };

const allCounts = allLabels.map(t => rcMap[t] || 0);
const filteredLabels = allLabels.filter((_, i) => allCounts[i] > 0);
const filteredCounts = allCounts.filter(v => v > 0);
const chartLabels = filteredLabels.length ? filteredLabels : allLabels;
const chartCounts = filteredLabels.length ? filteredCounts : allCounts;
const programRef = {};
function buildProgramChart(type) {
  const isPie = type === 'pie' || type === 'doughnut';
  return new Chart(document.getElementById('programChart'), {
    type,
    data: {
      labels: chartLabels,
      datasets: [{
        label: 'Scholars',
        data: chartCounts,
        backgroundColor: PIE_COLORS,
        borderWidth: 1,
        borderRadius: isPie ? 0 : 6,
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: pieLegend(isPie),
      },
      scales: isPie ? {} : {
        x: { grid: { color: gridColor } },
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1, precision: 0 } },
      },
    },
  });
}
programRef.chart = buildProgramChart('bar');
makeToggle('programChartToggle', programRef, ['bar','pie','doughnut','line'], buildProgramChart);

{% if show_trend %}
const trendLabels = [{% for t in trend_data %}'{{ t.display|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const trendSeries = [
  {% for s in trend_series %}
  { name: '{{ s.type|escapejs }}', data: [{% for c in s.counts %}{{ c }}{% if not forloop.last %},{% endif %}{% endfor %}] }{% if not forloop.last %},{% endif %}
  {% endfor %}
];
const trendRef = {};
function buildTrendChart(type) {
  const isLine = type === 'line';
  return new Chart(document.getElementById('trendChart'), {
    type: isLine ? 'line' : 'bar',
    data: {
      labels: trendLabels,
      datasets: trendSeries.map(function (s, i) {
        const colour = PIE_COLORS[i % PIE_COLORS.length];
        return {
          label: s.name,
          data: s.data,
          backgroundColor: isLine ? 'transparent' : colour,
          borderColor: colour,
          borderWidth: isLine ? 2.5 : 1.5,
          borderRadius: isLine ? 0 : 6,
          pointBackgroundColor: colour,
          pointRadius: isLine ? 4 : 0,
          pointHoverRadius: isLine ? 6 : 0,
          fill: false,
          tension: 0.4,
        };
      }),
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: trendSeries.length > 1,
          position: 'bottom',
          labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true, font: { size: 11 } },
        },
        tooltip: {
          callbacks: {
            title: (items) => items[0].label.replace('\\n', ' '),
          },
        },
      },
      scales: {
        x: {
          grid: { color: gridColor },
          ticks: { maxRotation: 45, minRotation: 30 },
        },
        y: {
          beginAtZero: true,
          grid: { color: gridColor },
          ticks: { stepSize: 1, precision: 0 },
          title: { display: true, text: 'Number of Scholars', color: '#6b7a99', font: { size: 11 } },
        },
      },
    },
  });
}
trendRef.chart = buildTrendChart('line');
makeToggle('trendChartToggle', trendRef, ['line', 'bar'], buildTrendChart);
{% endif %}
(function () {
  document.querySelectorAll('.chart-png-btn').forEach(function (btn) {
    var canvas = document.getElementById(btn.dataset.png);
    if (canvas && chartHasData(canvas)) return;
    btn.disabled = true;
    btn.title = 'No data to export for the semester and programme you are viewing.';
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.chart-png-btn');
    if (!btn || btn.disabled) return;
    downloadChart(btn.dataset.png, btn.dataset.pngName);
  });
})();
</script>
