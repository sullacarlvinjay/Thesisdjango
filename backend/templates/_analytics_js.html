{% load static %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="{% static 'js/excel-charts.js' %}?v=7"></script>
<script>
function chartHasData(canvas) {
  const chart = (window.Chart && Chart.getChart) ? Chart.getChart(canvas) : null;
  if (!chart) return false;
  return (chart.data.datasets || []).some(function (ds) {
    return (ds.data || []).some(function (v) {
      const n = (v && typeof v === 'object') ? (v.y != null ? v.y : v.v) : v;
      return typeof n === 'number' && !isNaN(n) && n !== 0;
    });
  });
}
function downloadChart(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  if (!chartHasData(canvas)) return;
  const sheet = document.createElement('canvas');
  sheet.width = canvas.width;
  sheet.height = canvas.height;
  const ctx = sheet.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, sheet.width, sheet.height);
  ctx.drawImage(canvas, 0, 0);
  const link = document.createElement('a');
  link.download = filename + '.png';
  link.href = sheet.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
const DEGREE_PREFIX = /^bachelor\s+(?:of\s+)?(?:science|arts)?\s*(?:in\s+)?/i;
const LEGEND_MAX = 26;
function legendText(text) {
  const short = String(text).replace(DEGREE_PREFIX, '').trim() || String(text);
  return short.length > LEGEND_MAX ? short.slice(0, LEGEND_MAX - 1) + '…' : short;
}
function shortLegendLabels(chart) {
  const type = chart.config.type;
  const generate = (Chart.overrides[type] && Chart.overrides[type].plugins
                    && Chart.overrides[type].plugins.legend
                    && Chart.overrides[type].plugins.legend.labels
                    && Chart.overrides[type].plugins.legend.labels.generateLabels)
                || Chart.defaults.plugins.legend.labels.generateLabels;
  return generate(chart).map(item =>
    Object.assign({}, item, { text: legendText(item.text) }));
}
function excelChart(canvas, type, labels, series, config) {
  const settings = Object.assign({}, config || {});
  const pie = type === 'pie' || type === 'doughnut';
  const datasets = pie
    ? [Object.assign({ label: series[0].name }, ExcelChart.slices(series[0].data))]
    : ExcelChart.bars(labels, series);
  settings.pie = pie;
  settings.categoryCount = (labels || []).length;
  settings.table = settings.table !== false;
  if (settings.legend === undefined) settings.legend = series.length > 1;
  return new Chart(canvas, {
    type: pie ? type : 'bar',
    data: { labels: labels, datasets: datasets },
    options: ExcelChart.options(settings),
  });
}
function makeToggle(containerId, chartRef, types, buildFn) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (types.length < 2) { container.hidden = true; return; }
  types.forEach((choice, index) => {
    const value = typeof choice === 'string' ? choice : choice.value;
    const text = typeof choice === 'string'
      ? value.charAt(0).toUpperCase() + value.slice(1)
      : choice.label;
    const btn = document.createElement('button');
    btn.className = 'chart-toggle-btn' + (index === 0 ? ' active' : '');
    btn.textContent = text;
    btn.onclick = () => {
      container.querySelectorAll('.chart-toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chartRef.chart.destroy();
      chartRef.chart = buildFn(value);
    };
    container.appendChild(btn);
  });
}
{% if show_gwa %}
const gwaLabels = [{% for g in gpa_ranges %}'{{ g.range }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const gwaData   = [{% for g in gpa_ranges %}{{ g.count }}{% if not forloop.last %},{% endif %}{% endfor %}];
const gwaRef = {};
function buildGwaChart(type) {
  return excelChart(document.getElementById('gwaChart'), type, gwaLabels,
    [{ name: 'Students', data: gwaData }],
    { title: 'GWA Distribution', categoryTitle: 'GWA band' });
}
gwaRef.chart = buildGwaChart('bar');
makeToggle('gwaChartToggle', gwaRef, ['bar','pie','doughnut'], buildGwaChart);
{% endif %}
{% if course_dist %}
const cLabels = [{% for c in course_dist %}'{{ c.course|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const cData   = [{% for c in course_dist %}{{ c.scholars }}{% if not forloop.last %},{% endif %}{% endfor %}];
const courseRef = {};
function buildCourseChart(type) {
  const pie = type === 'pie' || type === 'doughnut';
  return excelChart(document.getElementById('courseChart'), type, cLabels,
    [{ name: 'Scholars', data: cData }], {
      title: 'Scholars by Program',
      categoryTitle: 'Program',
      indexAxis: pie ? 'x' : 'y',
      generateLabels: shortLegendLabels,
    });
}
courseRef.chart = buildCourseChart('bar');
makeToggle('courseChartToggle', courseRef, ['bar','pie','doughnut'], buildCourseChart);
{% endif %}
{% if show_trend %}
const trendLabels = [{% for t in trend_data %}'{{ t.display|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
const trendSeries = [
  {% for s in trend_series %}
  { name: '{{ s.type|escapejs }}', data: [{% for c in s.counts %}{{ c }}{% if not forloop.last %},{% endif %}{% endfor %}] }{% if not forloop.last %},{% endif %}
  {% endfor %}
];
const trendInYear = [{% for t in trend_data %}{% if t.label in trend_year_labels %}true{% else %}false{% endif %}{% if not forloop.last %},{% endif %}{% endfor %}];
const trendInTerm = [{% for t in trend_data %}{% if t.label in term_labels %}true{% else %}false{% endif %}{% if not forloop.last %},{% endif %}{% endfor %}];
const TREND_YEAR = '{{ selected_academic_year|escapejs }}';
const TREND_TERM = '{{ selected_term_display|escapejs }}';
const TREND_PROGRAM = '{% if selected_type %}{{ selected_type|escapejs }}{% endif %}';
const TREND_ONE_TERM = {% if whole_year %}false{% else %}true{% endif %};
const TREND_RANGES = (TREND_ONE_TERM
  ? [{ value: 'term', label: 'This semester' },
     { value: 'year', label: 'This academic year' }]
  : [{ value: 'year', label: 'This academic year' }]
).concat([{ value: 'all', label: 'All academic years' }]);
const trendRef = {};
const trendCountBox = document.getElementById('trendCount');
function trendShown() {
  const value = trendCountBox ? parseInt(trendCountBox.value, 10) : 0;
  return isNaN(value) ? 0 : value;
}
function trendSlice(range) {
  let keep = trendLabels.map((_, i) => {
    if (range === 'all') return true;
    if (range === 'term') return trendInTerm[i];
    return trendInYear[i];
  });
  if (range === 'all') {
    const shown = trendShown();
    const total = keep.filter(Boolean).length;
    if (shown > 0 && total > shown) {
      let budget = shown;
      keep = keep.map(() => false);
      for (let i = trendLabels.length - 1; i >= 0 && budget > 0; i -= 1) {
        keep[i] = true;
        budget -= 1;
      }
    }
  }
  const labels = trendLabels.filter((_, i) => keep[i]);
  const series = trendSeries.map(s => ({
    name: s.name,
    data: s.data.filter((_, i) => keep[i]),
  }));
  const withData = series.filter(s => s.data.some(v => v));
  return { labels: labels, series: withData.length ? withData : series };
}
function trendScope(range) {
  if (range === 'all') return 'All academic years';
  if (range === 'term') return TREND_TERM;
  return TREND_YEAR;
}
function buildTrendChart(range) {
  trendRef.range = range;
  const slice = trendSlice(range);
  const scope = trendScope(range);
  const counter = document.querySelector('.trend-count');
  if (counter) counter.hidden = range !== 'all' || trendLabels.length < 5;
  const heading = document.querySelector('[data-trend-scope]');
  if (heading) heading.textContent = '— ' + scope;
  const caption = document.querySelector('[data-trend-range]');
  if (caption) {
    caption.textContent = range === 'all'
      ? 'every academic year on record'
      : scope;
  }
  return excelChart(document.getElementById('trendChart'), 'bar',
    slice.labels.map(l => l.replace('\n', ' ')), slice.series, {
      title: (TREND_PROGRAM ? TREND_PROGRAM + ' Scholars' : 'Scholars')
             + ' by Semester — ' + scope,
      categoryTitle: 'Semester',
      legend: slice.series.length > 1,
    });
}
trendRef.chart = buildTrendChart(TREND_RANGES[0].value);
makeToggle('trendChartToggle', trendRef, TREND_RANGES, buildTrendChart);
if (trendCountBox) {
  trendCountBox.addEventListener('change', () => {
    trendRef.chart.destroy();
    trendRef.chart = buildTrendChart(trendRef.range);
  });
}
{% endif %}
(function () {
  document.querySelectorAll('.chart-png-btn').forEach(function (btn) {
    var canvas = document.getElementById(btn.dataset.png);
    if (canvas && chartHasData(canvas)) return;
    btn.disabled = true;
    btn.title = 'No data to export for the semester and programme you are viewing.';
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.chart-png-btn');
    if (!btn || btn.disabled) return;
    downloadChart(btn.dataset.png, btn.dataset.pngName);
  });
})();
</script>
