<div class="card p-6">
  <p class="card-eyebrow">Password</p>
  <p class="text-xs mb-4 text-muted-foreground">
    Leave all three blank to keep the password you have. Changing it here signs
    nobody out — including you, in this tab.
  </p>
  <div class="grid sm:grid-cols-3 gap-4">
    <div class="space-y-1.5">
      <label for="currentPassword">Current password</label>
      <input id="currentPassword" name="current_password" type="password"
             autocomplete="current-password" />
    </div>
    <div class="space-y-1.5">
      <label for="newPassword">New password</label>
      <input id="newPassword" name="new_password" type="password"
             autocomplete="new-password" />
    </div>
    <div class="space-y-1.5">
      <label for="newPasswordConfirm">Repeat new password</label>
      <input id="newPasswordConfirm" name="new_password_confirm" type="password"
             autocomplete="new-password" />
    </div>
  </div>
  <p class="text-xs mt-3 text-muted-foreground">
    At least 8 characters, and not one of the passwords everybody picks. If you
    forget it, the SDSO can set a new one for you.
  </p>
</div>
