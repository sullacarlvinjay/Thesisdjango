name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # The suite runs against SQLite with local file storage and no outbound
      # mail. Anything that needs Supabase or Brevo is covered at the seam
      # instead — see docs/TESTING.md.
      DEBUG: 'True'
      SECRET_KEY: ci-only-not-a-real-secret
      TIME_ZONE: Asia/Manila

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        # Scoped to the modules that decide money plus the ones written with
        # annotations from the start — see [tool.mypy] in pyproject.toml.
        # Widening the file list is how the rest of the codebase gets adopted.
        run: python -m mypy

      - name: OpenAPI schema
        # --fail-on-warn keeps the published contract complete: a new endpoint
        # with no serializer fails here rather than shipping undocumented.
        run: python manage.py spectacular --fail-on-warn --validate --file /dev/null

      - name: Tests with branch coverage
        # Not --parallel: on Python 3.14 the parallel runner dies with
        # "cannot pickle 'traceback' object" the moment a case errors, which
        # replaces the real failure with a serialisation crash.
        run: python -m coverage run manage.py test api -v 1

      - name: Coverage report
        run: |
          python -m coverage combine || true
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: docs/coverage/
          if-no-files-found: ignore
